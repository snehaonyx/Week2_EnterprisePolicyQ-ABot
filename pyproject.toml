[project]
name = "enterprise-policy-qa-bot"
version = "0.1.0"
description = "RAG-powered Q&A over enterprise policy documents"
requires-python = ">=3.13"
dependencies = [
    "streamlit",
    "langchain",
    "langchain-google-genai",
    "langchain-community",
    "langchain-chroma",
    "pypdf",
    "langgraph",
    "python-dotenv",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "reportlab",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["vendor"]
